<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Automasync — gestão e detalhamento de projetos de automação."
    />
    <title>Automasync • Projetos de automação</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMTIiIGZpbGw9IiMyNDYzZWIiLz48cGF0aCBkPSJNMTAgMzQgMjMgMTJoNGwxMSAyMmgtOGwtNS0xMC02IDEweiIgZmlsbD0id2hpdGUiLz48cGF0aCBkPSJNMTcgMzdoMTUiIHN0cm9rZT0iIzkyYjlmZiIgc3Ryb2tlLXdpZHRoPSIzIi8+PC9zdmc+Cg==" />
    <!-- CSS: aparência e responsividade -->
<style>
/* Automasync: tokens compartilhados por todas as telas. */
:root {
  --navy: #101e35;
  --blue: #245ee9;
  --blue-soft: #edf3ff;
  --bg: #f4f6fa;
  --surface: #fff;
  --ink: #15243d;
  --muted: #627087;
  --line: #e1e6ef;
  --green: #127a57;
  --amber: #995400;
  --red: #bb3442;
  --radius: 12px;
  --shadow: 0 8px 30px #182e5110;
  --sidebar: 242px;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.5;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
a {
  color: var(--blue);
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #91b6ff;
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: 1.85rem;
  letter-spacing: -0.045em;
  line-height: 1.2;
  margin-bottom: 8px;
}
h2 {
  font-size: 1.12rem;
  letter-spacing: -0.02em;
}
h3 {
  font-size: 1rem;
}
small,
.small {
  font-size: 0.8125rem;
}
svg.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.muted {
  color: var(--muted);
}
.mono {
  font-variant-numeric: tabular-nums;
}
.skip-link {
  position: absolute;
  top: -80px;
  z-index: 1000;
  background: white;
  padding: 12px;
}
.skip-link:focus {
  top: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.23rem;
  font-weight: 750;
  letter-spacing: -0.04em;
}
.brand img {
  width: 35px;
  height: 35px;
}
.brand small {
  display: block;
  font-weight: 400;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: #9daec8;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--navy);
  color: white;
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding: 26px 16px 16px;
}
.sidebar .brand {
  padding: 0 8px 26px;
}
.nav-scroll {
  overflow: auto;
  flex: 1;
  scrollbar-width: thin;
}
.nav-label {
  font-size: 0.7rem;
  font-weight: 650;
  letter-spacing: 0.13em;
  color: #8e9fba;
  padding: 20px 13px 8px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: none;
  color: #b7c4d8;
  width: 100%;
  padding: 10px 13px;
  text-align: left;
  border-radius: 7px;
  font-size: 0.875rem;
  margin: 2px 0;
}
.nav-link:hover {
  background: #ffffff0c;
  color: white;
}
.nav-link.active {
  background: #284369;
  color: #fff;
  box-shadow: inset 3px 0 #77a5ff;
}
.sidebar-footer {
  margin-top: 15px;
  border-top: 1px solid #ffffff16;
  padding: 16px 8px 0;
  font-size: 0.8rem;
  color: #a8b6cb;
}
.workspace {
  margin-left: var(--sidebar);
}
.topbar {
  height: 76px;
  border-bottom: 1px solid var(--line);
  background: white;
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar-project {
  min-width: 0;
  max-width: 280px;
}
.topbar-project label {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
}
.topbar select {
  border: 0;
  padding: 0;
  background: transparent;
  font-size: 0.875rem;
  font-weight: 600;
  width: 100%;
}
.global-search {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  margin-left: auto;
  background: #f6f8fb;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 12px;
  max-width: 260px;
}
.global-search input {
  border: 0;
  background: none;
  width: 100%;
  padding: 0;
  min-height: 0;
  font-size: 0.8125rem;
  outline: none;
}
.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #e9effb;
  color: #295591;
  display: grid;
  place-items: center;
  flex: none;
  font-weight: 700;
  font-size: 0.8rem;
}
.user {
  display: flex;
  gap: 10px;
  align-items: center;
}
.user strong {
  font-size: 0.8125rem;
  display: block;
}
.user small {
  color: var(--muted);
  display: block;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  min-height: 38px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  position: relative;
}
.icon-button:hover {
  background: var(--bg);
}
.notification-count {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--red);
  color: white;
  font-size: 0.6rem;
  border-radius: 12px;
  min-width: 15px;
}
.menu-toggle {
  display: none;
}
main {
  max-width: 1600px;
  margin: auto;
  padding: 30px 32px 50px;
}
.breadcrumb {
  font-size: 0.8125rem;
  color: var(--muted);
  margin-bottom: 24px;
}
.page-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  margin-bottom: 25px;
}
.page-head p {
  color: var(--muted);
  font-size: 0.875rem;
  margin: 0;
}
.actions {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  padding: 9px 14px;
  border-radius: 7px;
  font-size: 0.875rem;
  font-weight: 600;
  display: inline-flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  min-height: 40px;
  text-decoration: none;
}
.btn:hover {
  background: #f5f8ff;
  border-color: #becce1;
}
.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.btn.primary:hover {
  background: #184ecb;
}
.btn.danger {
  color: var(--red);
  border-color: #f0c5ca;
}
.btn.small {
  padding: 5px 9px;
  min-height: 32px;
  font-size: 0.8125rem;
}
.btn.ghost {
  background: transparent;
  border-color: transparent;
}
.context {
  border: 1px solid var(--line);
  background: white;
  border-radius: 9px;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 24px;
  font-size: 0.8125rem;
}
.context strong {
  display: block;
}
.context .progress {
  width: 110px;
}
.progress {
  height: 5px;
  border-radius: 6px;
  background: #e7edf6;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--blue);
  border-radius: 6px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.metric {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 0.8125rem;
}
.metric-top .icon {
  color: #6882a8;
}
.metric-value {
  font-size: 2rem;
  font-weight: 650;
  letter-spacing: -0.05em;
  margin: 8px 0 2px;
}
.metric small {
  color: var(--muted);
}
.metric .positive {
  color: var(--green);
}
.grid {
  display: grid;
  gap: 22px;
}
.grid.two {
  grid-template-columns: 1.65fr 1fr;
}
.grid.half {
  grid-template-columns: 1fr 1fr;
}
.grid.three {
  grid-template-columns: repeat(3, 1fr);
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 22px;
}
.panel-body {
  padding: 22px;
}
.panel-header {
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 12px;
}
.panel-header h2 {
  margin: 0;
}
.panel-header small {
  color: var(--muted);
}
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
}
.toolbar input {
  max-width: 270px;
}
.toolbar select {
  width: auto;
  max-width: 230px;
}
.table-wrap {
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  white-space: nowrap;
}
th {
  padding: 12px 20px;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  background: #fafbfd;
  border-bottom: 1px solid var(--line);
}
td {
  padding: 15px 20px;
  border-bottom: 1px solid #edf0f5;
  font-size: 0.875rem;
  vertical-align: middle;
}
tr:last-child td {
  border-bottom: 0;
}
td strong {
  font-weight: 600;
}
td small {
  display: block;
  color: var(--muted);
  margin-top: 3px;
}
tbody tr:hover {
  background: #fafcff;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 5px;
  padding: 3px 8px;
  font-size: 0.75rem;
  font-weight: 600;
  background: #edf1f7;
  color: #50627d;
  white-space: nowrap;
}
.badge.blue {
  background: #eaf1ff;
  color: #2b5dc6;
}
.badge.green {
  background: #e7f5ee;
  color: var(--green);
}
.badge.amber {
  background: #fff3db;
  color: var(--amber);
}
.badge.red {
  background: #feebed;
  color: var(--red);
}
.link {
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  color: var(--blue);
  font-weight: 600;
}
.empty {
  padding: 55px 20px;
  text-align: center;
  color: var(--muted);
}
.empty .icon {
  width: 32px;
  height: 32px;
  margin-bottom: 12px;
}
.empty h3 {
  color: var(--ink);
  margin: 0 0 6px;
}
.empty p {
  font-size: 0.875rem;
}
.list-item {
  display: flex;
  gap: 13px;
  align-items: flex-start;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.list-item:last-child {
  border: 0;
}
.list-item p {
  margin: 3px 0 0;
  font-size: 0.8125rem;
  color: var(--muted);
}
.list-item strong {
  font-size: 0.875rem;
}
.list-item .actions {
  margin-left: auto;
}
.square-icon {
  background: var(--blue-soft);
  color: var(--blue);
  border-radius: 8px;
  padding: 9px;
  display: flex;
  flex: none;
}
.alert {
  padding: 14px 16px;
  border-radius: 8px;
  border: 1px solid #f0d6a5;
  background: #fff9ed;
  color: #825319;
  font-size: 0.875rem;
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}
.alert.info {
  background: #f0f5ff;
  border-color: #d2e0fc;
  color: #33598d;
}
.alert.error {
  background: #fff1f2;
  color: var(--red);
  border-color: #f4cbd0;
}
.alert p {
  margin: 0;
}
.bars {
  display: grid;
  gap: 17px;
}
.bar-row {
  display: grid;
  grid-template-columns: 130px 1fr 40px;
  gap: 12px;
  align-items: center;
  font-size: 0.8125rem;
}
.bar-track {
  height: 12px;
  background: #eff3f8;
  border-radius: 3px;
  overflow: hidden;
}
.bar-track span {
  height: 100%;
  display: block;
  background: var(--blue);
  border-radius: 3px;
}
.chart-legend {
  display: flex;
  gap: 18px;
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 20px;
}
.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--blue);
  margin-right: 5px;
}
.chart {
  width: 100%;
  height: 185px;
  display: block;
}
.timeline {
  display: flex;
  gap: 0;
  overflow: auto;
  padding: 20px 0;
  margin-bottom: 10px;
}
.timeline-step {
  min-width: 120px;
  flex: 1;
  font-size: 0.75rem;
  color: var(--muted);
  border-top: 3px solid #e3e9f2;
  padding: 12px 12px 0 0;
}
.timeline-step.done {
  border-color: var(--blue);
  color: var(--blue);
}
.timeline-step strong {
  display: block;
}
.tabs {
  display: flex;
  gap: 5px;
  border-bottom: 1px solid var(--line);
  padding: 0 15px;
  overflow: auto;
  margin-bottom: 20px;
}
.tab {
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 13px 15px;
  background: none;
  color: var(--muted);
  white-space: nowrap;
  font-size: 0.875rem;
}
.tab.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
  font-weight: 600;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.product,
.room-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}
.product header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
}
.product h3 {
  margin: 12px 0 5px;
}
.product p {
  font-size: 0.8125rem;
  color: var(--muted);
  min-height: 40px;
}
.product .price {
  font-size: 1.15rem;
  font-weight: 650;
}
.product footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
}
.product-illustration {
  width: 64px;
  height: 64px;
  object-fit: contain;
}
.details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}
.detail {
  font-size: 0.875rem;
}
.detail span {
  display: block;
  color: var(--muted);
  font-size: 0.75rem;
  margin-bottom: 4px;
}
.detail strong {
  font-weight: 550;
  overflow-wrap: anywhere;
}
form .form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 17px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.875rem;
  min-width: 0;
}
.field.full {
  grid-column: 1/-1;
}
.field label {
  font-weight: 550;
}
input,
select,
textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid #d6deea;
  border-radius: 7px;
  padding: 10px 12px;
  color: var(--ink);
  background: white;
  min-height: 42px;
}
textarea {
  min-height: 86px;
  resize: vertical;
}
input[type="checkbox"] {
  width: 18px;
  min-height: 18px;
  accent-color: var(--blue);
  flex: none;
}
input[type="range"] {
  padding: 0;
}
.check {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 0.875rem;
}
.field small {
  color: var(--muted);
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0 0 25px;
}
legend {
  font-weight: 650;
  margin: 10px 0 17px;
}
.form-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding-top: 22px;
  margin-top: 22px;
  border-top: 1px solid var(--line);
}
dialog {
  border: 0;
  border-radius: 14px;
  box-shadow: 0 20px 100px #101e3555;
  padding: 0;
  width: min(760px, 94vw);
  max-height: 90vh;
  color: var(--ink);
}
dialog::backdrop {
  background: #0e1d3790;
  backdrop-filter: blur(3px);
}
.modal-head {
  padding: 20px 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.modal-head h2 {
  margin: 0;
}
.modal-body {
  padding: 25px;
}
#toast {
  position: fixed;
  bottom: 25px;
  right: 25px;
  z-index: 100;
  background: var(--navy);
  color: white;
  padding: 14px 20px;
  border-radius: 9px;
  box-shadow: var(--shadow);
  max-width: calc(100vw - 40px);
  display: none;
}
#toast.show {
  display: block;
}
.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
}
.login-art {
  background: var(--navy);
  padding: 50px 10%;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  position: relative;
}
.login-art h1 {
  font-size: 3rem;
  max-width: 480px;
  font-weight: 550;
  letter-spacing: -0.05em;
}
.login-art p {
  color: #a7bad7;
  max-width: 380px;
}
.login-art .drawing {
  width: 100%;
  max-width: 400px;
  color: #6988bc;
  margin: 30px 0;
}
.login-form {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.login-form > div {
  width: 100%;
  max-width: 400px;
}
.login-form h1 {
  font-size: 1.8rem;
}
.login-form .field {
  margin-bottom: 19px;
}
.login-form .btn.primary {
  width: 100%;
  margin-top: 20px;
}
.login-form .brand {
  margin-bottom: 50px;
}
.login-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--muted);
  font-size: 0.75rem;
  margin: 28px 0 20px;
}
.login-divider:before,
.login-divider:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}
.login-form .actions .btn {
  flex: 1;
}
.plan-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 18px;
}
.plan-viewport {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f7f9fc;
  padding: 20px;
  min-height: 450px;
}
.plan-canvas {
  position: relative;
  width: 100%;
  min-height: 390px;
  aspect-ratio: 1.5;
  background-color: white;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  transform-origin: top left;
}
.floorplan {
  position: absolute;

function totals(p = selected, budget = null) {

  if (b?.scenario === "Essencial")
    items = items.filter((i) => i.scenario === "Essencial");
  if (b?.scenario === "Recomendado")
    items = items.filter((i) => i.scenario !== "Completo");
  const base = items.reduce(
      (s, i) => s + Number(i.quantity) * Number(i.price),
      0,
    ),
    tax = (base * Number(b?.tax || 0)) / 100,
    margin = (base * Number(b?.margin || 0)) / 100,
    discount = Number(b?.discount || 0),
    reserve =
      (Math.max(0, base + tax + margin - discount) * Number(b?.reserve || 0)) /
      100,
    actual = items.reduce(
      (s, i) =>
        s + Number(i.actualQuantity || 0) * Number(i.actualPrice ?? i.price),
      0,
    );
  return {
    items,
    base,
    tax,
    margin,
    discount,
    reserve,
    total: Math.max(0, base + tax + margin - discount + reserve),
    actual,
    saldo: Math.max(0, base + tax + margin - discount + reserve) - actual,

function budgetChart(projects) {
  const max = Math.max(
    ...projects.map((p) => Math.max(totals(p.id).total, totals(p.id).actual)),
    1,
  );
  return `<svg class="chart" role="img" aria-label="Comparação de custos previstos e realizados por projeto" viewBox="0 0 520 185">${[0, 1, 2, 3].map((i) => `<line x1="10" x2="510" y1="${20 + i * 40}" y2="${20 + i * 40}" stroke="#e5ebf3"/>`).join("")}${projects
    .map((p, i) => {
      let t = totals(p.id),
        x = 28 + i * 100;
      return `<g><title>${esc(p.name)}: previsto ${money(t.total)}, realizado ${money(t.actual)}</title><rect x="${x}" y="${150 - (t.total / max) * 120}" width="25" height="${(t.total / max) * 120}" rx="3" fill="#245ee9"/><rect x="${x + 30}" y="${150 - (t.actual / max) * 120}" width="25" height="${(t.actual / max) * 120}" rx="3" fill="#8ba9db"/><text x="${x + 26}" y="173" text-anchor="middle" font-size="11" fill="#627087">${esc(p.name.slice(0, 12))}</text></g>`;
    })
    .join("")}</svg>`;
}

function getRecommendations() {

    rs = scoped("rooms"),
    r = rs[0];
  if (!d || !r) return [];
  const categoryMap = {
    Iluminação: "Iluminação",
    Cortinas: "Cortinas",
    Climatização: "Climatização",
    Segurança: "Segurança",
    Monitoramento: "Sensores",
    "Economia de energia": "Medição",
    Conforto: "Controle",
    Acessibilidade: "Controle",
    "Controle de acesso": "Segurança",
    "Áudio e vídeo": "Controle",
  };
  return db.products
    .filter(
      (p) =>
        p.status === "Ativo" &&

function fieldHTML(f, data = {}) {
  let value = data[f.key] ?? "",
    id = "f-" + f.key;
  const opts = (f.options || []).map((o) => (Array.isArray(o) ? o : [o, o]));
  let input =
    f.type === "select"
      ? `<select id="${id}" name="${f.key}" ${f.required ? "required" : ""}><option value="">Selecione</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(value) === String(v) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
      : f.type === "textarea"
        ? `<textarea id="${id}" name="${f.key}" ${f.required ? "required" : ""}>${esc(value)}</textarea>`
        : f.type === "checkbox"
          ? `<label class="check"><input id="${id}" name="${f.key}" type="checkbox" ${value ? "checked" : ""}>${esc(f.label)}</label>`
          : `<input id="${id}" name="${f.key}" type="${f.type}" value="${esc(value)}" ${f.required ? "required" : ""} ${f.type === "number" ? 'min="0" max="100000000" step="0.01"' : ""} ${f.type === "password" ? 'minlength="8" autocomplete="new-password"' : ""}>`;
  return `<div class="field ${["textarea", "checkbox"].includes(f.type) ? "full" : ""}">${f.type !== "checkbox" ? `<label for="${id}">${esc(f.label)}${f.required ? ' <span aria-label="obrigatório">*</span>' : ""}</label>` : ""}${input}</div>`;
}
function openForm(title, fields, data, cb, extra = "", footer = "Salvar") {
  const draftKey =
    "auto-draft:" + currentUser()?.id + ":" + selected + ":" + title;
  let draft = {};
  try {
    draft = JSON.parse(localStorage.getItem(draftKey) || "{}");
  } catch {}
  data = { ...data, ...draft };
  modal(
    title,
    `<form id="data-form"><p class="small muted">* Campos obrigatórios</p><div class="form-grid">${fields.map((f) => fieldHTML(f, data)).join("")}</div>${extra}<p id="form-error" class="error-text" role="alert"></p><div class="form-footer">${button("Cancelar", "close-modal")}<button class="btn primary" type="submit">${esc(footer)}</button></div></form>`,
  );
  $("#data-form").dataset.draftKey = draftKey;
  $("#data-form").addEventListener("input", () => {
    const f = $("#data-form"),
      d = Object.fromEntries(new FormData(f));
    for (const x of fields) {
      if (["password", "file"].includes(x.type)) delete d[x.key];
      if (x.type === "checkbox") d[x.key] = f.elements[x.key].checked;
    }
    try {
      localStorage.setItem(draftKey, JSON.stringify(d));
    } catch {}
  });
  $("#data-form")
    .querySelectorAll("button[data-action]")
    .forEach((b) => (b.type = "button"));
  formCallback = (form, submitter) => {
    let values = Object.fromEntries(new FormData(form));
    for (const f of fields) {
      if (f.type === "number")
        values[f.key] = values[f.key] === "" ? "" : Number(values[f.key]);
      if (f.type === "checkbox") values[f.key] = form.elements[f.key].checked;
    }
    return cb(values, form, submitter);
  };
}

    toast("Seu perfil não tem permissão para esta ação.", true);
    return false;
  }

function ensureDraft(cb) {
  const b = scoped("budgets")[0];
  if (b?.status === "Aprovado") {
    confirmAction(
      "Criar nova versão?",
      "Esta alteração modifica o projeto aprovado. A composição atual será preservada e a nova versão precisará de aprovação.",
      () => {
        closeModal();
        newVersion(false);
        cb();
      },
    );
  } else cb();
}
function newVersion(notify = true) {
  const b = scoped("budgets")[0],
    p = project();
  if (!b) return;
  const snapshot = {
    version: b.version,
    at: today(),
    user: currentUser().name,
    status: b.status,
    scenario: b.scenario,
    totals: totals(),
    items: clone(scoped("items")),
    rooms: clone(scoped("rooms")),
    documents: clone(scoped("documents")),
    project: clone({ ...p, history: [] }),
    approval: { by: b.approvedBy, evidence: b.approvalEvidence },
  };
  b.snapshots.push(snapshot);
  b.version++;
  b.status = "Rascunho";
  b.approvedBy = "";
  b.approvalEvidence = "";
  p.version++;
  p.status = "Em detalhamento";
  p.actualConfirmed = false;
  scoped("executions").forEach((x) => {
    x.accepted = false;
    x.status = "Com pendência";
    x.notes = (x.notes || "") + " Revisar para a nova versão.";
  });
  p.history.push({
    version: p.version,
    at: today(),
    title: "Nova versão criada",
    user: currentUser().name,
  });
  log("Versão " + p.version + " aberta para revisão");
  if (notify) save("Nova versão criada. A anterior foi preservada.");
}
function editRecord(collection, id = null, defaults = {}) {
  const area =
    {
      products: "catalog",
      surveys: "survey",
      executions: "execution",
      items: "budgets",
    }[collection] || collection;
  if (!can(area)) {
    toast("Ação indisponível para este perfil.", true);
    return;
  }
  if (collection === "projects" && id && id !== selected) {
    selected = id;
    localStorage.setItem("auto-project", selected);
  }
  const current = id ? byId(collection, id) : null,
    data = current || { projectId: selected, created: today(), ...defaults };
  if (
    ["rooms", "items", "surveys", "projects"].includes(collection) &&
    scoped("budgets")[0]?.status === "Aprovado"
  ) {
    ensureDraft(() => editRecord(collection, id, defaults));
    return;
  }
  let fields = schema[collection]();
  let extra = "";
  if (collection === "users")
    extra = `<fieldset><legend>Permissões adicionais</legend><div class="form-grid">${["projects", "clients", "rooms", "plan", "survey", "catalog", "recommendations", "compatibility", "budgets", "revisions", "execution", "documents"].map((a) => `<label class="check"><input name="perm-${a}" type="checkbox" ${(data.permissions || []).includes(a) ? "checked" : ""}>${esc(MODULES.find((m) => m[0] === a)?.[1] || a)}</label>`).join("")}</div></fieldset>`;
  if (collection === "surveys")
    extra = `<div class="alert info" style="margin-top:20px"><p id="survey-progress">Preencha os campos e confirme para concluir. Rascunhos podem conter informações ausentes.</p></div><button type="button" class="btn" data-action="save-survey-draft">Salvar rascunho</button>`;
  const titles = {
    clients: "cliente",
    properties: "imóvel",
    projects: "projeto",
    rooms: "ambiente",
    surveys: "vistoria",
    products: "equipamento",
    items: "item",
    revisions: "solicitação",
    executions: "execução",
    users: "profissional",
  };
  openForm(
    (id ? "Editar " : "Cadastrar ") + titles[collection],
    fields,
    data,
    (v, form, submitter) => {
      const draft = submitter?.dataset?.draft === "true";
      if (collection === "clients" && v.taxId && !validTaxId(v.taxId))
        return "Informe um CPF ou CNPJ válido, ou deixe o campo vazio.";
      if (collection === "projects") {
        if (byId("properties", v.propertyId)?.clientId !== v.clientId)
          return "O imóvel deve pertencer ao cliente selecionado.";
        if (v.deadline < v.start)
          return "O prazo não pode ser anterior ao início.";
        if (db.projects.some((p) => p.code === v.code && p.id !== id))
          return "Este código já está cadastrado.";
      }
      if (collection === "properties" && v.area <= 0)
        return "A área deve ser maior que zero.";
      if (collection === "rooms" && (v.area <= 0 || v.height <= 0))
        return "Área e pé-direito devem ser maiores que zero.";
      if (
        collection === "items" &&
        (v.quantity <= 0 || !Number.isInteger(v.quantity))
      )
        return "Use uma quantidade inteira maior que zero.";
      if (
        collection === "products" &&
        db.products.some((p) => p.sku === v.sku && p.id !== id)
      )
        return "SKU já cadastrado.";
      if (collection === "users") {
        if (
          db.users.some(
            (u) =>
              u.email.toLowerCase() === v.email.toLowerCase() && u.id !== id,
          )
        )
          return "E-mail já cadastrado.";
        if (
          id === currentUser().id &&
          (v.status !== "Ativo" || v.role !== "Gestor")
        )
          return "Seu próprio acesso de gestor deve permanecer ativo.";
        v.permissions = Array.from(
          form.querySelectorAll('[name^="perm-"]:checked'),
        ).map((e) => e.name.slice(5));
        v.approved = v.status === "Ativo";
      }
      if (collection === "surveys") {
        if (!draft && !v.confirmed)
          return "Confirme as informações antes de concluir.";
        if (
          db.surveys.some(
            (s) =>
              s.projectId === selected && s.roomId === v.roomId && s.id !== id,
          )
        )
          return "Já existe vistoria para este ambiente. Edite o registro existente.";
        v.status = draft ? "Rascunho" : "Concluída";
        if (!draft) {
          const r = byId("rooms", v.roomId);
          Object.assign(r, {
            voltage: v.voltage,
            circuit: v.circuit,
            wires: v.wires,
            board: v.board,
            approved: true,
          });
        }
      }

function validTaxId(value) {
  const s = value.replace(/\D/g, "");
  if (![11, 14].includes(s.length) || /^(\d)\1+$/.test(s)) return false;
  const digit = (text, weights) => {
    const mod =
      text.split("").reduce((n, c, i) => n + Number(c) * weights[i], 0) % 11;
    return mod < 2 ? 0 : 11 - mod;
  };
  if (s.length === 11)
    return (
      digit(s.slice(0, 9), [10, 9, 8, 7, 6, 5, 4, 3, 2]) === +s[9] &&
      digit(s.slice(0, 10), [11, 10, 9, 8, 7, 6, 5, 4, 3, 2]) === +s[10]
    );
  return (
    digit(s.slice(0, 12), [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]) === +s[12] &&
    digit(s.slice(0, 13), [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]) === +s[13]
  );
}

          p.id,

        p.dependency === "Fonte 24 V" &&

          r.id,
          "source",
          "Incompatível",
          "Fonte 24 V ausente",
          "Adicionar fonte apropriada ao circuito e às cargas.",
          p.id,
        );
      if (
        p.category === "Iluminação" &&
        p.name.includes("Dimmer") &&
        Number(r.power) > Number(p.capacity)
      )
        push(
          r.id,
          "load-" + p.id,
          "Incompatível",

          "qty-" + p.id,

          "Quantidade excede limite demonstrativo",
          "Conferir circuito e limite no manual oficial.",
          p.id,
        );

        push(

          "range-" + p.id,
          "Atenção",
          "Distância acima do alcance demonstrativo",
          "Verificar cobertura e repetidores.",
          p.id,
        );
      if (
        p.protocol &&
        r.protocol &&
        p.protocol !== r.protocol &&
        p.protocol !== "Cabeado"
      )
        push(
          r.id,
          "protocol-" + p.id,
          "Atenção",
          "Integração entre protocolos precisa de validação",
          "Confirmar suporte do gateway; protocolos distintos podem coexistir.",
          p.id,
        );

    if (!r.wires || !r.board)
      push(
        r.id,
        "infra",
        "Informação ausente",
        "Infraestrutura elétrica incompleta",
        "Registrar fiação e quadro elétrico.",

        r.id,
        "network",
        "Atenção",
        "Cobertura de rede insuficiente",
        "Registrar adequação da rede.",
        "",
      );
  });

    let i = db.issues.find(
      (i) => i.projectId === selected && i.ruleKey === f.key,
    );

        id: uid("issue"),
        projectId: selected,
        ...f,
        ruleKey: f.key,
        source: "Regra demonstrativa",
        owner: project().installer,
        deadline: project().deadline,
        status: "Aberta",
        justification: "",
        history: [],
      });
  }
  scoped("issues")
    .filter(
      (i) =>
        i.ruleKey &&
        !found.some((f) => f.key === i.ruleKey) &&
        i.status !== "Resolvida",
    )
    .forEach((i) => {
      i.status = "Resolvida";
      i.history.push({
        at: new Date().toISOString(),
        user: currentUser().name,
        text: "Condição não encontrada na nova verificação.",
      });
    });

  log("Compatibilidade verificada: " + found.length + " condições encontradas");

    found.length

  );

function installationProblems() {
  const b = scoped("budgets")[0],
    rs = scoped("rooms"),
    problems = [];
  if (b?.status !== "Aprovado") problems.push("Orçamento ainda não aprovado.");
  if (!rs.length) problems.push("Nenhum ambiente cadastrado.");
  rs.forEach((r) => {
    const missing = ["voltage", "circuit", "wires", "board", "gateway"].filter(
      (k) => !r[k],
    );
    if (missing.length)
      problems.push(
        r.name +
          ": informações técnicas ausentes (" +
          missing.join(", ") +
          ").",
      );
    if (
      !scoped("surveys").some(
        (s) => s.roomId === r.id && s.status === "Concluída",
      )
    )
      problems.push(r.name + ": vistoria não concluída.");
  });
  if (conflicts().length)
    problems.push(conflicts().length + " pendências técnicas abertas.");
  if (!totals().items.length) problems.push("Orçamento sem itens.");
  return problems;
}

function uploadDocument(
  category = "Outro",
  targetId = selected,
  targetType = "Projeto",
  roomId = "",
) {
  openForm(
    "Enviar " + category.toLowerCase(),
    [
      F("category", "Categoria!", "select", [
        "Planta",
        "Foto",
        "Manual",
        "Proposta",
        "Como construído",
        "Outro",
      ]),
      F("description", "Descrição"),
      F("file", "Arquivo!", "file"),
    ],
    { category },
    async (v, form) => {
      const file = form.elements.file.files[0];
      if (!file) return "Selecione um arquivo.";
      if (file.size > 1024 * 1024) return "O limite local é 1 MB por arquivo.";
      if (
        ![
          "image/png",
          "image/jpeg",
          "image/webp",
          "application/pdf",
          "text/plain",
        ].includes(file.type)
      )
        return "Use PDF, PNG, JPG, WEBP ou TXT.";
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const doc = {
        id: uid("doc"),
        projectId: selected,
        roomId,
        targetId,
        targetType,
        name: file.name,
        category: v.category,
        description: v.description,
        type: file.type,
        size: file.size,
        data,
        author: currentUser().name,
        date: today(),
      };
      db.documents.push(doc);
      if (category === "Planta") project().planId = doc.id;
      if (!Store.save()) {
        db.documents.pop();
        if (project().planId === doc.id) delete project().planId;
        return "Não há espaço para este arquivo. Exporte o backup e remova anexos antigos.";
      }
      log("Documento anexado: " + file.name);
      closeModal();
      save();
    },
  );
  $("#f-file").accept = ".pdf,.png,.jpg,.jpeg,.webp,.txt";
}

function download(name, data, type = "application/json") {
  const a = document.createElement("a");
  let url =
    typeof data === "string" && data.startsWith("data:")
      ? data
      : URL.createObjectURL(new Blob([data], { type }));
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  if (url.startsWith("blob:")) setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function hashPassword(password, salt) {
  if (!globalThis.crypto?.subtle)
    throw Error(
      "Este navegador não oferece criptografia local. Use os perfis de demonstração ou execute em localhost.",
    );
  const bytes = new TextEncoder().encode(password);
  const key = await crypto.subtle.importKey("raw", bytes, "PBKDF2", false, [
    "deriveBits",
  ]);
  const bits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: new TextEncoder().encode(salt),
      iterations: 100000,
      hash: "SHA-256",
    },
    key,
    256,
  );
  return Array.from(new Uint8Array(bits))
    .map((n) => n.toString(16).padStart(2, "0"))
    .join("");
}

function deleteRecord(collection, id) {
  const r = byId(collection, id);
  if (!r) return;
  const refs =
    collection === "clients"
      ? db.properties.some((p) => p.clientId === id) ||
        db.projects.some((p) => p.clientId === id)
      : collection === "properties"
        ? db.projects.some((p) => p.propertyId === id)
        : collection === "items"
          ? db.executions.some((x) => x.itemId === id)
          : collection === "rooms"
            ? db.items.some((i) => i.roomId === id) ||
              db.surveys.some((s) => s.roomId === id)
            : false;
  if (refs)
    return toast(
      "Este cadastro possui vínculos. Remova ou transfira os registros associados primeiro.",
      true,
    );
  confirmAction(
    "Excluir registro?",
    `Excluir “${r.name || r.description}”? Esta ação remove o registro do navegador.`,
    () => {
      db[collection] = db[collection].filter((x) => x.id !== id);
      if (collection === "documents" && project()?.planId === id)
        delete project().planId;
      log("Registro excluído: " + (r.name || r.description));
      closeModal();
      save();
    },
  );
}

function validateBackup(o) {
  const arrays = [
    "users",
    "clients",
    "properties",
    "projects",
    "rooms",
    "products",
    "items",
    "budgets",
    "revisions",
    "surveys",
    "executions",
    "diagnoses",
    "issues",
    "documents",
    "decisions",
    "notifications",
    "activity",
  ];
  if (
    o.schema !== 1 ||
    arrays.some((k) => !Array.isArray(o[k])) ||
    !o.settings ||
    !o.savedFilters
  )
    throw Error("Estrutura incompatível.");
  if (
    !o.users.some(
      (u) => u.role === "Gestor" && u.approved && u.status === "Ativo",
    )
  )
    throw Error("Nenhum gestor ativo.");
  for (const k of arrays) {
    if (
      o[k].some((x) => !x || typeof x !== "object" || typeof x.id !== "string")
    )
      throw Error("Registro inválido em " + k);
    if (new Set(o[k].map((x) => x.id)).size !== o[k].length)
      throw Error("Identificadores repetidos.");
  }
  const has = (key, id) => o[key].some((x) => x.id === id);
  if (
    o.projects.some(
      (p) => !has("clients", p.clientId) || !has("properties", p.propertyId),
    )
  )
    throw Error("Vínculos de projeto inválidos.");
  if (o.rooms.some((r) => !has("projects", r.projectId)))
    throw Error("Ambiente sem projeto.");
  if (
    o.items.some(
      (i) =>
        !has("projects", i.projectId) ||
        !has("rooms", i.roomId) ||
        !Number.isFinite(Number(i.quantity)) ||
        Number(i.quantity) < 0,
    )
  )
    throw Error("Item inválido.");
  if (
    o.documents.some(
      (d) =>
        !/^data:(image\/(png|jpeg|webp)|application\/pdf|text\/plain);base64,/.test(
          d.data,
        ),
    )
  )
    throw Error("Tipo de anexo não permitido.");
}
async function submitDataForm(form, submitter, skipValidation = false) {
  if (!skipValidation && !form.reportValidity()) return;
  const cb = formCallback;
  if (!cb) return;
  try {
    const result = await cb(form, submitter);
    if (typeof result !== "string" && form.dataset.draftKey)
      localStorage.removeItem(form.dataset.draftKey);
    if (typeof result === "string") {
      const el = $("#form-error");
      if (el) {
        el.textContent = result;
        el.scrollIntoView({ block: "nearest" });
      } else toast(result, true);
    }
  } catch (e) {
    if ($("#form-error")) $("#form-error").textContent = e.message;
    else toast(e.message, true);
  }
}
// Delegação de eventos: todos os módulos compartilham os mesmos pontos de entrada.
document.addEventListener("click", (event) => {
  const routeButton = event.target.closest("[data-route]");
  if (routeButton) {
    closeModal();
    navigate(routeButton.dataset.route);
    return;
  }
  const actionButton = event.target.closest("[data-action]");
  if (actionButton && !actionButton.disabled) {
    event.preventDefault();
    const { action, id } = actionButton.dataset;
    if (action.startsWith("print-")) printAction(action.slice(6), id);
    else if (actions[action]) actions[action](id);
    return;
  }
  const canvas = event.target.closest("#plan-canvas.place");
  if (canvas && !event.target.closest(".pin")) {
    const rect = canvas.getBoundingClientRect(),
      p = project(),
      roomId = $("#plan-room").value;
    p.pins = p.pins || [];
    p.pins.push({
      id: uid("pin"),
      category: planCategory,
      roomId,
      x: Math.round(((event.clientX - rect.left) / rect.width) * 10000) / 100,
      y: Math.round(((event.clientY - rect.top) / rect.height) * 10000) / 100,
      notes: "",
    });
    log("Ponto adicionado à planta: " + planCategory);
    save();
  }
});
document.addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "data-form") return submitDataForm(form, event.submitter);
  const v = Object.fromEntries(new FormData(form));
  if (form.id === "login-form") {
    const btn = form.querySelector("[type=submit]");
    btn.disabled = true;
    btn.textContent = "Verificando acesso…";
    try {
      const u = db.users.find(
        (u) => u.email.toLowerCase() === v.email.toLowerCase(),
      );
      if (
        !u?.passwordHash ||
        !u.approved ||
        u.status !== "Ativo" ||
        (await hashPassword(v.password, u.salt)) !== u.passwordHash
      ) {
        $("#login-error").textContent =
          "Credenciais inválidas ou acesso ainda não aprovado.";
        return;
      }
      login(u, !!v.remember);
    } catch (e) {
      $("#login-error").textContent = e.message;
    } finally {
      if (btn.isConnected) {
        btn.disabled = false;
        btn.textContent = "Entrar no workspace";
      }
    }
  }
  if (form.id === "comment-form") {
    if (!can("revisions")) return;
    const r = byId("revisions", v.id);
    r.comments.push({
      text: v.text,
      user: currentUser().name,
      at: new Date().toISOString(),
      mention: v.mention,
    });
    if (v.mention)
      db.notifications.unshift({
        id: uid("n"),
        projectId: r.projectId,
        title: currentUser().name + " mencionou você: " + v.text,
        userId: v.mention,
        read: false,
        at: today(),
      });
    log("Comentário registrado em " + r.title);
    render();
    revisionDetail(v.id);
  }
  if (form.id === "issue-form") {
    if (!can("compatibility")) return;
    const i = byId("issues", v.id);
    if (i.ruleKey && i.severity === "Incompatível") {
      toast(
        "Corrija o cadastro e execute uma nova verificação. Esta regra não admite resolução manual.",
        true,
      );
      return;
    }
    i.status = "Resolvida";
    i.justification = v.reason;
    i.history.push({
      at: new Date().toISOString(),
      user: currentUser().name,
      text: v.reason,
    });
    log("Pendência resolvida: " + i.title);
    closeModal();
    save();
  }
  if (form.id === "actual-form") {
    if (!can("execution")) return;
    for (const i of totals().items) {
      i.actualQuantity = Number(v["qty-" + i.id]);
      i.actualPrice = Number(v["price-" + i.id]);
    }
    project().actualConfirmed = true;
    log("Custos e quantidades realizados atualizados");
    closeModal();
    save();
  }
});
document.addEventListener("change", (event) => {
  const el = event.target;
  if (el.id === "project-select") {
    selected = el.value;
    localStorage.setItem("auto-project", selected);
    roomSelected = "";
    filters.page = 1;
    render();
  }
  if (el.dataset.filter) {
    filters[el.dataset.filter] = el.value;
    filters.page = 1;
    render();
  }
  if (el.dataset.compare) {
    if (el.checked && catalogCompared.size >= 4) {
      el.checked = false;
      return toast("Compare até quatro equipamentos.");
    }
    el.checked
      ? catalogCompared.add(el.dataset.compare)
      : catalogCompared.delete(el.dataset.compare);
    render();
  }
  if (el.dataset.itemQty) {
    if (!can("budgets") || scoped("budgets")[0]?.status === "Aprovado")
      return render();
    const n = Number(el.value);
    if (!Number.isInteger(n) || n < 1 || n > 10000) {
      toast("Quantidade inválida.", true);
      return render();
    }
    const i = byId("items", el.dataset.itemQty);
    const before = i.quantity * i.price,
      after = n * i.price;
    confirmAction(
      "Confirmar quantidade?",
      `Subtotal: ${money(before)} → ${money(after)}. Diferença: ${money(after - before)}.`,
      () => {
        i.quantity = n;
        log("Quantidade atualizada: " + i.description);
        closeModal();
        save();
      },
    );
  }
  if (el.id === "plan-category") planCategory = el.value;
  if (el.id === "plan-room") roomSelected = el.value;
  if (el.dataset.categoryToggle) {
    el.checked
      ? hiddenCategories.delete(el.dataset.categoryToggle)
      : hiddenCategories.add(el.dataset.categoryToggle);
    render();
  }
});
let filterTimer;
document.addEventListener("input", (event) => {
  const el = event.target;
  if (el.dataset.filter === "q") {
    clearTimeout(filterTimer);
    const pos = el.selectionStart;
    filterTimer = setTimeout(() => {
      filters.q = el.value;
      filters.page = 1;
      render();
      const n = $("[data-filter=q]");
      n?.focus();
      n?.setSelectionRange(pos, pos);
    }, 240);
  }
  if (el.type === "tel") {
    const s = el.value.replace(/\D/g, "").slice(0, 11);
    el.value =
      s.length > 2
        ? "(" +
          s.slice(0, 2) +
          ") " +
          (s.length > 7 ? s.slice(2, -4) + "-" + s.slice(-4) : s.slice(2))
        : s;
  }
  if (el.id === "f-taxId") {
    const s = el.value.replace(/\D/g, "").slice(0, 14);
    el.value =
      s.length <= 11
        ? s
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d{1,2})$/, "$1-$2")
        : s.replace(
            /^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/,
            "$1.$2.$3/$4-$5",
          );
  }
});
document.addEventListener("keydown", (event) => {
  if (event.target.id === "global-search" && event.key === "Enter") {
    event.preventDefault();
    const q = event.target.value.trim().toLowerCase();
    if (!q) return;
    const matches = [
      ...db.projects.map((p) => ({
        title: p.name,
        detail: p.code,
        action: "open-project",
        id: p.id,
      })),
      ...db.clients.map((c) => ({
        title: c.name,
        detail: c.email,
        action: "client-detail",
        id: c.id,
      })),
      ...db.products.map((p) => ({
        title: p.name,
        detail: p.sku,
        action: "product-detail",
        id: p.id,
      })),
    ].filter((x) => (x.title + " " + x.detail).toLowerCase().includes(q));
    modal(
      "Resultados da busca",
      matches.length
        ? matches
            .slice(0, 25)
            .map(
              (m) =>
                `<div class="list-item"><div><strong>${esc(m.title)}</strong><p>${esc(m.detail)}</p></div><div class="actions">${button("Abrir", m.action, m.id, "small")}</div></div>`,
            )
            .join("")
        : '<p class="muted">Nenhum resultado encontrado.</p>',
    );
  }
});
window.addEventListener("storage", (event) => {
  if (event.key === KEY) {
    db = Store.load();
    render();
  }
});
window.addEventListener("hashchange", () => {
  const next = location.hash.slice(1);
  if (next !== route) {
    route = next;
    filters.q = "";
    filters.page = 1;
    render();
  }
});
$("#modal").addEventListener("click", (e) => {
  if (e.target === $("#modal")) {
    const r = $("#modal").getBoundingClientRect();
    if (
      e.clientX < r.left ||
      e.clientX > r.right ||
      e.clientY < r.top ||
      e.clientY > r.bottom
    )
      closeModal();
  }
});
Store.save();
render();
/* Ponte opcional para agentes em navegadores compatíveis. Usa os mesmos dados da UI.
 * Sem suporte a modelContext, o aplicativo continua funcionando normalmente.
 */
if (document.modelContext?.registerTool) {
  const lifecycle = new AbortController();
  const requireSession = () => {
    const user = currentUser();
    if (!user?.approved || user.status !== "Ativo")
      throw new Error("Entre com um perfil aprovado.");
  };
  const tools = [
    {
      name: "read_automasync_projects",
      description:
        "Consulta os projetos e seus status no workspace de demonstração.",
      inputSchema: {
        type: "object",
        properties: {},
        additionalProperties: false,
      },
      annotations: { readOnlyHint: true, untrustedContentHint: true },
      execute(input) {
        requireSession();
        if (!input || Object.keys(input).length)
          throw new Error("Nenhum parâmetro é aceito.");
        return db.projects.map((p) => ({
          id: p.id,
          name: p.name,
          status: p.status,
          completion: completion(p.id),
        }));
      },
    },
    {
      name: "open_automasync_project",
      description:
        "Seleciona um projeto existente e abre sua tela de ambientes, sem alterar os registros.",
      inputSchema: {
        type: "object",
        properties: { projectId: { type: "string" } },
        required: ["projectId"],
        additionalProperties: false,
      },
      annotations: { readOnlyHint: false, untrustedContentHint: true },
      execute(input) {
        requireSession();
        if (
          !input ||
          Object.keys(input).some((k) => k !== "projectId") ||
          !byId("projects", input.projectId)
        )
          throw new Error("Projeto inválido.");
        actions["open-project"](input.projectId);
        return { projectId: selected, page: route };
      },
    },
  ];
  tools.forEach((tool) => {
    try {
      Promise.resolve(
        document.modelContext.registerTool(tool, { signal: lifecycle.signal }),
      ).catch(() => {});
    } catch {
      /* A ausência desta integração não interfere na navegação. */
    }
  });
  window.addEventListener("pagehide", () => lifecycle.abort(), { once: true });
}

</script>
</body>
